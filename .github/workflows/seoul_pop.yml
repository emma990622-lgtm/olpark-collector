name: 서울 생활인구(행정동) 받기 - 시험
on:
  push:
    branches: [data/seoul-pop]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 다운로드 방식 확인
        run: |
          curl -sSL -A "Mozilla/5.0" "https://data.seoul.go.kr/dataList/OA-14991/S/1/datasetView.do" -o page.html
          sed -n '665,745p' page.html
          curl -sS -L -A "Mozilla/5.0" -e "https://data.seoul.go.kr/dataList/OA-14991/S/1/datasetView.do" \
            -X POST "https://datafile.seoul.go.kr/bigfile/iot/inf/nio_download.do?&useCache=false" \
            --data-urlencode "infId=OA-14991" --data-urlencode "infSeq=3" --data-urlencode "seq=2503" --data-urlencode "seqNo=" \
            -D head.txt -o f.zip
          cat head.txt; ls -la f.zip; file f.zip
          unzip -l f.zip | head; unzip -p f.zip | head -c 1500 | iconv -f cp949 -t utf-8 || true
